<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5eee8"><title>Delivery dispatch | CALLYROSE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--ink:#29211e;--muted:#786c65;--rose:#b97870;--cream:#f5eee8;--paper:#fffdfa;--line:#e9ddd4}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}.top{height:68px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{font:500 22px 'Playfair Display',serif;letter-spacing:2px}.brand span{color:var(--rose)}main{max-width:1000px;margin:auto;padding:35px 18px 70px}.eyebrow{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--rose);font-weight:700}h1{font:400 38px 'Playfair Display',serif;margin:9px 0}.sub{font-size:12px;color:var(--muted);line-height:1.7}.state,.empty{background:var(--paper);border:1px solid var(--line);padding:22px;font-size:11px;color:var(--muted);line-height:1.8}.card{background:var(--paper);border:1px solid var(--line);padding:19px;margin:12px 0}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.order{font-size:13px;font-weight:700}.status{font-size:9px;text-transform:uppercase;letter-spacing:.6px;color:#805c4e;background:#f2e9e1;padding:7px 9px}.address{font-size:11px;color:var(--muted);line-height:1.7;margin:9px 0 14px}.assign{display:flex;gap:9px;flex-wrap:wrap}.assign select{flex:1;min-width:180px;padding:12px;border:1px solid var(--line);background:#fffdfa;font:11px 'DM Sans',sans-serif}.assign button{border:0;padding:12px 16px;background:var(--ink);color:#fff;font-size:9px;letter-spacing:.7px;text-transform:uppercase}.assign button:disabled{opacity:.5}.note{font-size:10px;color:var(--muted);margin-top:10px}.ok{color:#4d704a}.err{color:#a34f48}</style></head><body><header class="top"><a class="brand" href="dashboard.html">CALLY<span>ROSE</span></a><span style="font-size:10px;color:#786c65">DISPATCH</span></header>
<main><div class="eyebrow">Delivery operations</div><h1>Assign a delivery rider</h1><p class="sub">Assign a staff member to a delivery that is ready to leave. The order will move to Out for delivery, and the rider can then start sharing GPS from the rider portal.</p><div id="state" class="state">Loading dispatch queue…</div><div id="orders"></div></main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.119.0";
const db=createClient("https://syyvxrxzejfgqjybrnay.supabase.co","sb_publishable_RcRmuAzksTmt8SJX895v3Q_iP6zGrNM",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let staff=[],orders=[];
async function init(){const{data:{session},error}=await db.auth.getSession();if(error||!session){location.replace("login.html");return;}const{data:me}=await db.from("profiles").select("role").eq("id",session.user.id).single();if(!me||!["manager","admin"].includes(me.role)){$("state").textContent="Only authorized managers and administrators can assign delivery riders.";return;}
const[staffRes,orderRes]=await Promise.all([db.rpc("list_delivery_staff"),db.from("orders").select("id,order_number,customer_id,status,fulfilment_method,delivery_address").eq("fulfilment_method","delivery").in("status",["ready_for_dispatch","out_for_delivery"]).order("created_at",{ascending:true})]);
if(staffRes.error||orderRes.error){$("state").textContent="We couldn't load dispatch data. Please refresh or contact the system administrator.";return;}staff=staffRes.data||[];orders=orderRes.data||[];render();}
function render(){if(!orders.length){$("state").className="empty";$("state").textContent="There are no delivery orders waiting for dispatch.";return;}$("state").textContent=orders.length+" delivery order"+(orders.length===1?"":"s")+" ready for assignment";$("orders").innerHTML=orders.map(o=>{const a=o.delivery_address||{};return '<article class="card" data-order="'+o.id+'"><div class="head"><div class="order">Order '+esc(o.order_number||o.id.slice(0,8))+'</div><span class="status">'+esc(o.status.replaceAll("_"," "))+'</span></div><div class="address">'+esc([a.address,a.city,a.state].filter(Boolean).join(", ")||"Delivery address not supplied")+'</div><div class="assign"><select id="rider-'+o.id+'"><option value="">Choose delivery rider</option>'+staff.map(s=>'<option value="'+s.id+'">'+esc(s.full_name||"CALLYROSE staff")+'</option>').join("")+'</select><button type="button" data-assign="'+o.id+'">Assign & dispatch</button></div><div class="note" id="note-'+o.id+'">'+(o.status==="out_for_delivery"?"Already marked out for delivery. Reassigning will change the rider.":"Assigning a rider will mark this order Out for delivery.")+'</div></article>';}).join("");}
$("orders").addEventListener("click",async e=>{const b=e.target.closest("[data-assign]");if(!b)return;const id=b.dataset.assign,order=orders.find(x=>x.id===id),riderId=$("rider-"+id).value,note=$("note-"+id);if(!riderId){note.textContent="Choose a rider first.";note.className="note err";return;}b.disabled=true;b.textContent="Assigning…";note.textContent="Saving rider assignment…";note.className="note";const{error:assignError}=await db.from("delivery_tracking").upsert({order_id:id,customer_id:order.customer_id,rider_id:riderId,is_sharing:false,latitude:null,longitude:null,last_seen_at:null},{onConflict:"order_id"});if(assignError){note.textContent="Assignment failed. Check the rider role and order status.";note.className="note err";b.disabled=false;b.textContent="Assign & dispatch";return;}const{error:statusError}=await db.from("orders").update({status:"out_for_delivery",updated_at:new Date().toISOString()}).eq("id",id);if(statusError){note.textContent="Rider was assigned, but the order status could not be updated. Please retry or contact an administrator.";note.className="note err";b.disabled=false;b.textContent="Retry dispatch";return;}const{error:historyError}=await db.from("order_status_history").insert({order_id:id,status:"out_for_delivery",note:"Delivery rider assigned. Live GPS sharing can now begin."});note.textContent=historyError?"Rider assigned and order dispatched. Status history could not be recorded.":"Rider assigned. Order dispatched; the rider can now start live GPS sharing.";note.className="note ok";b.textContent="Dispatched";});
init();
</script></body></html>
