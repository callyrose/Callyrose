name: Publish CALLYROSE to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Prepare static website
        run: |
          mkdir _site
          cp index.html _site/index.html
          cp signup.html _site/signup.html
          cp login.html _site/login.html
          cp dashboard.html _site/dashboard.html
          cp product.html _site/product.html
          cp orders.html _site/orders.html
          cp rider.html _site/rider.html
          cp profile.html _site/profile.html
          cp transactions.html _site/transactions.html
          cp saved.html _site/saved.html
          cp settings.html _site/settings.html
          cp cart.html _site/cart.html
          cp checkout.html _site/checkout.html
          cp forgot-password.html _site/forgot-password.html
          cp terms.html _site/terms.html
          cp privacy.html _site/privacy.html
          if [ -d Assets ]; then cp -R Assets _site/Assets; fi
          if [ -d assets ]; then cp -R assets _site/assets; fi
          if [ -d images ]; then cp -R images _site/images; fi
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
