<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5eee8"><title>Complete payment | CALLYROSE"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--ink:#29211e;--rose:#b97870;--paper:#fffdfa;--cream:#f5eee8;--line:#e9ddd4;--muted:#786c65}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif;display:grid;place-items:center;padding:20px}.card{width:min(100%,560px);background:var(--paper);border:1px solid var(--line);padding:clamp(22px,6vw,44px)}.brand{font:25px 'Playfair Display';letter-spacing:2px;text-decoration:none;color:var(--ink)}.brand span{color:var(--rose)}.eyebrow{margin-top:32px;color:var(--rose);font-size:10px;letter-spacing:2px;text-transform:uppercase}h1{font:34px 'Playfair Display';margin:9px 0}.muted{font-size:12px;line-height:1.8;color:var(--muted)}.choice{display:flex;gap:12px;align-items:flex-start;padding:15px;border:1px solid var(--line);margin:10px 0;background:white;cursor:pointer}.choice input{margin-top:3px;accent-color:var(--rose)}.choice strong{display:block;font-size:12px}.choice small{display:block;font-size:10px;color:var(--muted);margin-top:4px}.btn{width:100%;padding:15px;background:var(--ink);color:white;border:0;font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-top:12px;cursor:pointer}.btn:disabled{opacity:.5}.outline{display:inline-block;padding:12px 16px;border:1px solid var(--line);font-size:10px;text-decoration:none;color:var(--ink);margin-top:14px}.notice{padding:15px;background:#fffaf6;border:1px solid var(--line);font-size:11px;line-height:1.8;margin-top:14px}.label{font-size:9px;color:var(--muted);letter-spacing:1px;margin:13px 0 4px}.value{font-size:15px;font-weight:700;word-break:break-word}.amount{font:26px 'Playfair Display';color:var(--rose)}.error{color:#a34f48}.hidden{display:none}
</style></head><body><main class="card"><a class="brand" href="dashboard.html">CALLY<span>ROSE</span></a><div class="eyebrow">Order payment</div><h1 id="heading">Complete your payment</h1><p id="intro" class="muted">Choose how you would like to pay for your order.</p><section id="chooser"><label class="choice"><input type="radio" name="method" value="card" checked><span><strong>Debit / Credit Card</strong><small>Pay securely using your bank card.</small></span></label><label class="choice"><input type="radio" name="method" value="bank_transfer"><span><strong>Bank Transfer</strong><small>Receive a temporary account number for this order.</small></span></label><button class="btn" id="continue">Continue to payment</button></section><section id="result" class="hidden"></section><p id="status" class="muted"></p><a class="outline" href="orders.html">Back to my orders</a></main>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.119.0";
const db=createClient("https://syyvxrxzejfgqjybrnay.supabase.co","sb_publishable_RcRmuAzksTmt8SJX895v3Q_iP6zGrNM",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),orderId=new URLSearchParams(location.search).get("order_id"),money=n=>"₦"+Number(n||0).toLocaleString("en-NG");
let orderNumber="";
async function verify(reference){$("status").textContent="Checking your payment…";const{data,error}=await db.functions.invoke("paystack-verify",{body:{reference}});if(data?.success){$("heading").textContent="Payment confirmed";$("result").innerHTML='<div class="notice">Your payment has been verified successfully. Your order is now confirmed.</div>';return true;}$("status").textContent=data?.error||error?.message||"Payment has not been confirmed yet. Please do not pay again.";return false;}
async function start(){
 const method=document.querySelector('input[name="method"]:checked')?.value;
 $("continue").disabled=true;$("continue").textContent="Preparing…";$("status").textContent="";
 const{data,error}=await db.functions.invoke("paystack-initialize",{body:{order_id:orderId,payment_method:method}});
 if(error||!data){$("continue").disabled=false;$("continue").textContent="Try again";$("status").className="muted error";$("status").textContent=data?.error||error?.message||"Payment is not available right now.";return;}
 orderNumber=data.order_number||"";
 $("chooser").classList.add("hidden");$("result").classList.remove("hidden");
 if(method==="card"&&data.public_key&&window.PaystackPop){
  $("heading").textContent="Secure card payment";$("intro").textContent="Complete your payment in the secure payment window.";
  const handler=window.PaystackPop.setup({key:data.public_key,email:data.email,amount:data.amount,currency:data.currency,ref:data.reference,channels:["card"],callback:async response=>{await verify(response.reference);},onClose:()=>{$("status").textContent="The payment window was closed. Your order remains pending until payment is confirmed."; $("chooser").classList.remove("hidden");$("continue").disabled=false;$("continue").textContent="Try payment again";}});
  handler.openIframe();return;
 }
 if(method==="bank_transfer"&&data.account_number){
  $("heading").textContent="Complete your bank transfer";$("intro").textContent="Transfer the exact amount to this temporary account for your order.";
  const expiry=new Date(data.expires_at).toLocaleString("en-NG");
  $("result").innerHTML='<div class="notice"><div class="label">ORDER</div><div class="value">'+orderNumber+'</div><div class="label">BANK</div><div class="value">'+data.bank_name+'</div><div class="label">ACCOUNT NAME</div><div class="value">'+data.account_name+'</div><div class="label">ACCOUNT NUMBER</div><div class="value" id="account">'+data.account_number+'</div><button class="btn" id="copy">Copy account number</button><div class="label">AMOUNT TO TRANSFER</div><div class="amount">'+money(data.amount/100)+'</div><div class="label">ACCOUNT EXPIRES</div><div class="value">'+expiry+'</div></div><button class="btn" id="check">I have made the transfer — check payment</button>';
  $("copy").addEventListener("click",()=>{navigator.clipboard?.writeText(data.account_number);$("copy").textContent="Copied";});
  $("check").addEventListener("click",()=>verify(data.reference));return;
 }
 $("status").className="muted error";$("status").textContent=data?.error||"This payment method is not available right now.";
}
(async()=>{const{data:{session}}=await db.auth.getSession();if(!session){location.replace("login.html?returnTo="+encodeURIComponent(location.pathname+location.search));return;}if(!orderId||!/^[0-9a-f-]{36}$/i.test(orderId)){$("chooser").classList.add("hidden");$("status").textContent="A valid order could not be found.";return;}$("continue").addEventListener("click",start);})();
</script></body></html>
