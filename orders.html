<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5eee8">
<title>My Orders | CALLYROSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#29211e;--muted:#786c65;--rose:#b97870;--cream:#f5eee8;--paper:#fffdfa;--line:#e9ddd4;--gold:#c8a47c}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}button{font:inherit;cursor:pointer}
.top{height:72px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,70px)}
.brand{font:500 24px 'Playfair Display',serif;letter-spacing:2.5px}.brand span{color:var(--rose)}.back{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}
main{max-width:1050px;margin:auto;padding:42px 20px 80px}.eyebrow{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--rose);font-weight:700}
h1{font:400 clamp(36px,5vw,52px) 'Playfair Display',serif;margin:9px 0}.sub{font-size:12px;color:var(--muted);margin:0 0 28px}
.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}.filter{border:1px solid var(--line);background:var(--paper);padding:10px 14px;font-size:10px;color:var(--muted)}.filter.active{background:var(--ink);color:white;border-color:var(--ink)}
.order-card{background:var(--paper);border:1px solid var(--line);margin:0 0 14px;padding:20px}.order-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.order-no{font-size:12px;font-weight:700}.date{font-size:10px;color:var(--muted);margin-top:5px}
.status{display:inline-block;padding:7px 10px;background:#f2e9e1;color:#805c4e;font-size:9px;text-transform:uppercase;letter-spacing:.7px}.items{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:17px 0;padding:13px 0;display:grid;gap:10px}
.item{display:flex;justify-content:space-between;gap:12px;font-size:11px}.item small{display:block;color:var(--muted);margin-top:4px}.total-row{display:flex;justify-content:space-between;align-items:center;font-size:11px}.total{font:500 22px 'Playfair Display',serif;color:var(--rose)}.meta{font-size:10px;color:var(--muted);margin-top:12px}
.track-toggle{margin-top:16px;width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:1px solid var(--line);background:#fffaf6;color:var(--ink);font-size:10px;text-align:left}.track-toggle:hover{border-color:var(--rose)}.track-toggle span:last-child{color:var(--rose);font-size:16px}
.track-panel{display:none;padding:19px 14px 7px;border:1px solid var(--line);border-top:0;background:#fffaf6}.track-panel.open{display:block}.track-title{font:400 21px 'Playfair Display',serif;margin:0 0 5px}.track-help{font-size:10px;color:var(--muted);line-height:1.7;margin:0 0 17px}
.timeline{list-style:none;padding:0;margin:0 0 8px 4px}.timeline li{position:relative;padding:0 0 19px 27px;border-left:1px solid #ddc9bc;margin-left:5px}.timeline li:last-child{border-left-color:transparent;padding-bottom:5px}.timeline li:before{content:"";position:absolute;left:-6px;top:1px;width:10px;height:10px;border-radius:50%;background:#fffaf6;border:1px solid #cbb5a8}.timeline li.latest:before{background:var(--rose);border-color:var(--rose);box-shadow:0 0 0 4px #b978701c}
.event-name{font-size:11px;font-weight:700;text-transform:capitalize}.event-date{font-size:9px;color:var(--muted);margin-top:4px}.event-note{font-size:10px;color:var(--muted);margin-top:5px;line-height:1.6}
.live-map{height:280px;border:1px solid var(--line);margin:12px 0 8px;z-index:1}.live-meta{font-size:10px;color:var(--muted);line-height:1.7}.live-pill{display:inline-block;padding:5px 8px;background:#edf3e9;color:#486344;font-size:9px;letter-spacing:.5px;text-transform:uppercase}.live-pill.off{background:#f4eae5;color:#91645b}.map-privacy{font-size:9px;color:var(--muted);line-height:1.6;margin:8px 0 12px}.empty,.loading,.error{background:var(--paper);border:1px solid var(--line);padding:36px 22px;text-align:center}.empty h2{font:400 26px 'Playfair Display',serif;margin:0 0 8px}.empty p,.loading,.error{font-size:11px;color:var(--muted);line-height:1.8}.cta{display:inline-block;margin-top:14px;padding:12px 18px;background:var(--ink);color:#fff;font-size:9px;letter-spacing:1px;text-transform:uppercase}.hidden{display:none}
@media(max-width:560px){.top{height:62px}.brand{font-size:21px}.order-card{padding:15px}.order-head{align-items:flex-start}.total{font-size:19px}}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
</head>
<body>
<header class="top"><a class="brand" href="dashboard.html">CALLY<span>ROSE</span></a><nav style="display:flex;gap:16px"><a class="back" href="cart.html">My cart</a><a class="back" href="dashboard.html">← Back to shop</a></nav></header>
<main>
<div class="eyebrow">Your account</div><h1>My Orders</h1><p class="sub">Keep track of your purchases and delivery progress.</p>
<div class="toolbar" id="filters"><button class="filter active" data-filter="all">All orders</button><button class="filter" data-filter="pending_payment">Pending payment</button><button class="filter" data-filter="processing">Processing</button><button class="filter" data-filter="completed">Completed</button></div>
<div id="ordersState" class="loading">Loading your orders…</div><div id="ordersList"></div>
</main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.119.0";
const supabase=createClient("https://syyvxrxzejfgqjybrnay.supabase.co","sb_publishable_RcRmuAzksTmt8SJX895v3Q_iP6zGrNM",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const state=document.getElementById("ordersState"),list=document.getElementById("ordersList");let orders=[];
const liveMaps=new Map(),liveChannels=new Map();
const money=n=>"₦"+Number(n||0).toLocaleString("en-NG");
const date=v=>v?new Date(v).toLocaleString("en-NG",{day:"numeric",month:"short",year:"numeric",hour:"numeric",minute:"2-digit"}):"";
const label=s=>String(s||"").replaceAll("_"," ");
const escapeHTML=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function timeline(o){
 const events=[{status:"order_placed",note:"Your order was created.",created_at:o.created_at,synthetic:true},...(o.history||[])];
 if(!(o.history||[]).length&&o.status!=="pending_payment")events.push({status:o.status,note:"Latest status currently recorded for this order.",created_at:o.updated_at||o.created_at,synthetic:true});
 const unique=[];for(const ev of events){const key=ev.status+"|"+ev.created_at;if(!unique.some(x=>x.key===key))unique.push({...ev,key});}
 unique.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
 return '<ol class="timeline">'+unique.map((ev,i)=>'<li class="'+(i===unique.length-1?'latest':'')+'"><div class="event-name">'+escapeHTML(label(ev.status))+'</div><div class="event-date">'+escapeHTML(date(ev.created_at))+'</div>'+(ev.note?'<div class="event-note">'+escapeHTML(ev.note)+'</div>':'')+'</li>').join("")+'</ol>';
}
function renderLiveMap(o){const el=document.getElementById("live-map-"+o.id);if(!el||!window.L)return;if(liveMaps.has(o.id))return;const map=L.map(el,{scrollWheelZoom:false}).setView([6.5244,3.3792],11);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,attribution:"© OpenStreetMap"}).addTo(map);liveMaps.set(o.id,{map,marker:null});if(o.live?.latitude!=null&&o.live?.longitude!=null)updateLiveMarker(o.id,o.live);setTimeout(()=>map.invalidateSize(),180);}
function updateLiveMarker(orderId,loc){const entry=liveMaps.get(orderId);if(!entry)return;if(loc.latitude!=null&&loc.longitude!=null){const pos=[Number(loc.latitude),Number(loc.longitude)];if(entry.marker)entry.marker.setLatLng(pos);else entry.marker=L.marker(pos).addTo(entry.map).bindPopup("CALLYROSE delivery rider");entry.map.setView(pos,15);}const stamp=loc.last_seen_at||loc.updated_at,stale=!stamp||(Date.now()-new Date(stamp).getTime()>120000),active=!!loc.is_sharing&&!stale;const badge=document.getElementById("live-status-"+orderId);if(badge){badge.textContent=active?"Rider sharing live location":(loc.is_sharing?"Last location update may be stale":"Waiting for rider location");badge.classList.toggle("off",!active);}const info=document.getElementById("live-info-"+orderId);if(info)info.textContent=stamp?"Last GPS update: "+date(stamp):"No GPS update received yet.";}
function connectLiveTracking(o){if(liveChannels.has(o.id))return;const ch=supabase.channel("delivery-live-"+o.id).on("postgres_changes",{event:"*",schema:"public",table:"delivery_tracking",filter:"order_id=eq."+o.id},payload=>{const loc=payload.new||{};o.live=loc;updateLiveMarker(o.id,loc);}).subscribe();liveChannels.set(o.id,ch);}
setInterval(()=>orders.forEach(o=>{if(o.live&&liveMaps.has(o.id))updateLiveMarker(o.id,o.live);}),30000);
function show(filter="all"){
 const rows=orders.filter(o=>filter==="all"||(filter==="completed"?["delivered","collected"].includes(o.status):filter==="processing"?["processing","preparing","ready_for_dispatch","out_for_delivery","ready_for_pickup"].includes(o.status):o.status===filter));
 list.innerHTML=rows.map(o=>{
  const items=o.items||[],id=escapeHTML(o.id);
  return '<article class="order-card"><div class="order-head"><div><div class="order-no">Order '+escapeHTML(o.order_number||o.id.slice(0,8).toUpperCase())+'</div><div class="date">Placed '+escapeHTML(date(o.created_at))+'</div></div><span class="status">'+escapeHTML(label(o.status))+'</span></div><div class="items">'+(items.length?items.map(i=>'<div class="item"><div>'+escapeHTML(i.product_name)+'<small>'+escapeHTML(i.variant_description||"Standard option")+' · Qty '+escapeHTML(i.quantity)+'</small></div><strong>'+money(i.line_total)+'</strong></div>').join(""):'<div class="item">Order details</div>')+'</div><div class="total-row"><span>Order total</span><strong class="total">'+money(o.total)+'</strong></div><div class="meta">'+(o.fulfilment_method==="branch_pickup"?"Branch pickup":"Delivery")+(o.delivery_estimate?" · "+escapeHTML(o.delivery_estimate):"")+'</div><button class="track-toggle" type="button" data-track="'+id+'" aria-expanded="false"><span>Track order & live delivery location</span><span aria-hidden="true">＋</span></button><section class="track-panel" id="track-'+id+'"><h3 class="track-title">Your order journey</h3><p class="track-help">Updates shown here come from CALLYROSE order records. New milestones will appear as your order is processed.</p>'+timeline(o)+'</section>'+(o.fulfilment_method==="delivery"?'<section class="track-panel live-track" id="live-track-'+id+'"><h3 class="track-title">Live delivery location</h3><span class="live-pill '+(o.live?.is_sharing?'':'off')+'" id="live-status-'+id+'">'+(o.live?.is_sharing?'Rider sharing live location':'Waiting for rider location')+'</span><div class="live-map" id="live-map-'+id+'"></div><p class="live-meta" id="live-info-'+id+'">The rider GPS position will appear here once the delivery is assigned and location sharing starts.</p><p class="map-privacy">Live location is shared only for this delivery and is visible to the customer who placed this order and the assigned rider.</p></section>':'')+'</article>';
 }).join("");
 if(!rows.length){state.className="empty";state.innerHTML='<h2>'+(orders.length?"No orders in this category":"You haven’t placed an order yet")+'</h2><p>'+(orders.length?"Try another filter to see your purchases.":"Your confirmed purchases will appear here. Start by choosing a mattress, then add it to your cart.")+'</p><div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap"><a class="cta" href="cart.html">View my cart</a><a class="cta" href="dashboard.html">Explore the collection</a></div>';state.classList.remove("hidden");}else state.classList.add("hidden");
}
list.addEventListener("click",e=>{const b=e.target.closest("[data-track]");if(!b)return;const panel=document.getElementById("track-"+b.dataset.track),open=panel.classList.toggle("open");const livePanel=document.getElementById("live-track-"+b.dataset.track);livePanel.classList.toggle("open",open);if(open){const order=orders.find(x=>x.id===b.dataset.track);if(order){renderLiveMap(order);connectLiveTracking(order);}}b.setAttribute("aria-expanded",String(open));b.querySelector("span:last-child").textContent=open?"−":"＋";b.querySelector("span:first-child").textContent=open?"Hide tracking":(orders.find(x=>x.id===b.dataset.track)?.fulfilment_method==="delivery"?"Track order & live delivery location":"Track order");});
async function init(){
 const{data:{session},error:authError}=await supabase.auth.getSession();if(authError||!session){location.replace("login.html");return;}
 const{data,error}=await supabase.from("orders").select("id,order_number,status,fulfilment_method,delivery_estimate,subtotal,delivery_fee,total,created_at,updated_at").eq("customer_id",session.user.id).order("created_at",{ascending:false});
 if(error){state.className="error";state.innerHTML='<strong>Your orders could not be loaded.</strong><br>Check your connection and try again. <br><button class="cta" id="retryOrders" type="button">Try again</button>';document.getElementById("retryOrders").onclick=()=>{state.className="loading";state.textContent="Loading your orders…";init();};return;}
 orders=data||[];
 if(orders.length){
  const ids=orders.map(o=>o.id);
  const liveResult=await supabase.from("delivery_tracking").select("order_id,latitude,longitude,accuracy_m,heading_deg,speed_mps,is_sharing,last_seen_at,updated_at").in("order_id",ids);
  if(!liveResult.error)for(const o of orders)o.live=(liveResult.data||[]).find(x=>x.order_id===o.id)||null;
  const[itemsResult,historyResult]=await Promise.all([
   supabase.from("order_items").select("order_id,product_name,variant_description,unit_price,quantity,line_total").in("order_id",ids),
   supabase.from("order_status_history").select("order_id,status,note,created_at").in("order_id",ids).order("created_at",{ascending:true})
  ]);
  if(!itemsResult.error)for(const o of orders)o.items=(itemsResult.data||[]).filter(i=>i.order_id===o.id);
  if(!historyResult.error)for(const o of orders)o.history=(historyResult.data||[]).filter(h=>h.order_id===o.id);
 }
 show();
}
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));show(b.dataset.filter)}));
init();
</script>
</body>
</html>
