<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5eee8"><title>My Orders | CALLYROSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#29211e;--muted:#786c65;--rose:#b97870;--cream:#f5eee8;--paper:#fffdfa;--line:#e9ddd4;--gold:#c8a47c}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}.top{height:72px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,70px)}.brand{font:500 24px 'Playfair Display',serif;letter-spacing:2.5px}.brand span{color:var(--rose)}.back{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}main{max-width:1050px;margin:auto;padding:42px 20px 80px}.eyebrow{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--rose);font-weight:700}h1{font:400 clamp(36px,5vw,52px) 'Playfair Display',serif;margin:9px 0}.sub{font-size:12px;color:var(--muted);margin:0 0 28px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px}.filter{border:1px solid var(--line);background:var(--paper);padding:10px 14px;font-size:10px;color:var(--muted);cursor:pointer}.filter.active{background:var(--ink);color:white;border-color:var(--ink)}.order-card{background:var(--paper);border:1px solid var(--line);margin:0 0 14px;padding:20px}.order-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.order-no{font-size:12px;font-weight:700}.date{font-size:10px;color:var(--muted);margin-top:5px}.status{display:inline-block;padding:7px 10px;background:#f2e9e1;color:#805c4e;font-size:9px;text-transform:uppercase;letter-spacing:.7px}.items{border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:17px 0;padding:13px 0;display:grid;gap:10px}.item{display:flex;justify-content:space-between;gap:12px;font-size:11px}.item small{display:block;color:var(--muted);margin-top:4px}.total-row{display:flex;justify-content:space-between;align-items:center;font-size:11px}.total{font:500 22px 'Playfair Display',serif;color:var(--rose)}.meta{font-size:10px;color:var(--muted);margin-top:12px}.empty,.loading,.error{background:var(--paper);border:1px solid var(--line);padding:36px 22px;text-align:center}.empty h2{font:400 26px 'Playfair Display',serif;margin:0 0 8px}.empty p,.loading,.error{font-size:11px;color:var(--muted);line-height:1.8}.cta{display:inline-block;margin-top:14px;padding:12px 18px;background:var(--ink);color:#fff;font-size:9px;letter-spacing:1px;text-transform:uppercase}.hidden{display:none}@media(max-width:560px){.top{height:62px}.brand{font-size:21px}.order-card{padding:15px}.order-head{align-items:flex-start}.total{font-size:19px}}
</style></head><body>
<header class="top"><a class="brand" href="dashboard.html">CALLY<span>ROSE</span></a><a class="back" href="dashboard.html">← Back to shop</a></header>
<main><div class="eyebrow">Your account</div><h1>My Orders</h1><p class="sub">Keep track of your purchases and delivery progress.</p>
<div class="toolbar" id="filters"><button class="filter active" data-filter="all">All orders</button><button class="filter" data-filter="pending_payment">Pending payment</button><button class="filter" data-filter="processing">Processing</button><button class="filter" data-filter="completed">Completed</button></div>
<div id="ordersState" class="loading">Loading your orders…</div><div id="ordersList"></div></main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.119.0";
const supabase=createClient("https://syyvxrxzejfgqjybrnay.supabase.co","sb_publishable_RcRmuAzksTmt8SJX895v3Q_iP6zGrNM",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const state=document.getElementById("ordersState"),list=document.getElementById("ordersList");let orders=[];
const money=n=>"₦"+Number(n||0).toLocaleString("en-NG");const date=v=>new Date(v).toLocaleDateString("en-NG",{day:"numeric",month:"short",year:"numeric"});
const label=s=>String(s||"").replaceAll("_"," ");
function show(filter="all"){const rows=orders.filter(o=>filter==="all"||(filter==="completed"?["delivered","collected"].includes(o.status):filter==="processing"?["processing","preparing","ready_for_dispatch","out_for_delivery","ready_for_pickup"].includes(o.status):o.status===filter));list.innerHTML=rows.map(o=>{const items=o.items||[];return '<article class="order-card"><div class="order-head"><div><div class="order-no">Order '+(o.order_number||o.id.slice(0,8).toUpperCase())+'</div><div class="date">Placed '+date(o.created_at)+'</div></div><span class="status">'+label(o.status)+'</span></div><div class="items">'+(items.length?items.map(i=>'<div class="item"><div>'+i.product_name+'<small>'+(i.variant_description||"Standard option")+' · Qty '+i.quantity+'</small></div><strong>'+money(i.line_total)+'</strong></div>').join(""):'<div class="item">Order details</div>')+'</div><div class="total-row"><span>Order total</span><strong class="total">'+money(o.total)+'</strong></div><div class="meta">'+(o.fulfilment_method==="branch_pickup"?"Branch pickup":"Delivery")+(o.delivery_estimate?" · "+o.delivery_estimate:"")+'</div></article>';}).join("");if(!rows.length){state.className="empty";state.innerHTML='<h2>'+(orders.length?"No orders in this category":"Your orders will appear here")+'</h2><p>'+(orders.length?"Try another filter to see your purchases.":"When you place an order with CALLYROSE, you can follow its status and details here.")+'</p><a class="cta" href="dashboard.html">Explore the collection</a>';state.classList.remove("hidden");}else state.classList.add("hidden");}
async function init(){const{data:{session},error:authError}=await supabase.auth.getSession();if(authError||!session){location.replace("login.html");return;}const{data,error}=await supabase.from("orders").select("id,order_number,status,fulfilment_method,delivery_estimate,subtotal,delivery_fee,total,created_at").eq("customer_id",session.user.id).order("created_at",{ascending:false});if(error){state.className="error";state.textContent="We couldn't load your orders right now. Please refresh and try again.";return;}orders=data||[];if(orders.length){const ids=orders.map(o=>o.id);const{data:items,error:itemError}=await supabase.from("order_items").select("order_id,product_name,variant_description,unit_price,quantity,line_total").in("order_id",ids);if(!itemError){for(const o of orders)o.items=(items||[]).filter(i=>i.order_id===o.id);}}show();}
document.querySelectorAll("[data-filter]").forEach(b=>b.addEventListener("click",()=>{document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));show(b.dataset.filter)}));init();
</script></body></html>
