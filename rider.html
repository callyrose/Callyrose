<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5eee8"><title>Rider delivery | CALLYROSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>:root{--ink:#29211e;--muted:#786c65;--rose:#b97870;--cream:#f5eee8;--paper:#fffdfa;--line:#e9ddd4}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}.top{height:68px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}.brand{font:500 22px 'Playfair Display',serif;letter-spacing:2px}.brand span{color:var(--rose)}main{max-width:760px;margin:auto;padding:35px 18px 70px}.eyebrow{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--rose);font-weight:700}h1{font:400 38px 'Playfair Display',serif;margin:9px 0}.sub{font-size:12px;color:var(--muted);line-height:1.7}.card{background:var(--paper);border:1px solid var(--line);padding:20px;margin:18px 0}.order{font-size:13px;font-weight:700}.address{font-size:11px;color:var(--muted);line-height:1.8;margin-top:8px}.status{font-size:10px;color:var(--muted);padding:12px 0}.btn{width:100%;border:0;padding:15px;background:var(--ink);color:white;font-size:10px;letter-spacing:1px;text-transform:uppercase}.btn.stop{background:#8c554f}.btn:disabled{opacity:.5}.note{font-size:10px;color:var(--muted);line-height:1.8;margin-top:14px}.empty{background:var(--paper);border:1px solid var(--line);padding:28px;text-align:center;color:var(--muted);font-size:12px;line-height:1.8}</style></head>
<body><header class="top"><a class="brand" href="dashboard.html">CALLY<span>ROSE</span></a><span style="font-size:10px;color:#786c65">RIDER PORTAL</span></header>
<main><div class="eyebrow">Delivery operations</div><h1>My deliveries</h1><p class="sub">When you start a delivery, allow location access. Your position is shared with the customer for that order while delivery tracking is active.</p><div id="state" class="status">Checking your assigned deliveries…</div><div id="deliveries"></div></main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.119.0";
const db=createClient("https://syyvxrxzejfgqjybrnay.supabase.co","sb_publishable_RcRmuAzksTmt8SJX895v3Q_iP6zGrNM",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id);let session=null,watchers=new Map(),rows=[];
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
async function init(){const{data,error}=await db.auth.getSession();session=data.session;if(error||!session){location.replace("login.html");return;}const{data:profile}=await db.from("profiles").select("role").eq("id",session.user.id).single();if(!profile||!["staff","manager","admin"].includes(profile.role)){$("state").textContent="This portal is for authorized CALLYROSE delivery staff.";return;}const{data:assigned,error:e}=await db.from("delivery_tracking").select("id,order_id,rider_id,is_sharing,last_seen_at,latitude,longitude,orders(order_number,status,delivery_address,fulfilment_method)").eq("rider_id",session.user.id);if(e){$("state").textContent="Unable to load assigned deliveries. Please refresh.";return;}rows=assigned||[];if(!rows.length){$("state").className="empty";$("state").textContent="No deliveries have been assigned to your account yet.";return;}$("state").textContent=rows.length+" assigned delivery"+(rows.length===1?"":"ies");$("deliveries").innerHTML=rows.map(r=>{const a=r.orders?.delivery_address||{};return '<article class="card"><div class="order">Order '+esc(r.orders?.order_number||r.order_id.slice(0,8))+'</div><div class="address">'+esc([a.address,a.city,a.state].filter(Boolean).join(", ")||"Delivery address on order")+'</div><div class="status" id="status-'+r.id+'">'+(r.is_sharing?"Location sharing is active":"Location sharing is off")+'</div><button class="btn '+(r.is_sharing?"stop":"")+'" id="btn-'+r.id+'" data-id="'+r.id+'">'+(r.is_sharing?"Stop sharing":"Start live location")+'</button><p class="note">Keep this page open during delivery. Your phone may ask you to allow location access. Location is shared only for this assigned order.</p></article>';}).join("");$("deliveries").addEventListener("click",e=>{const b=e.target.closest("[data-id]");if(b)toggle(b.dataset.id);});}
async function update(id,coords){const payload={latitude:coords?.latitude??null,longitude:coords?.longitude??null,accuracy_m:coords?.accuracy??null,heading_deg:coords?.heading??null,speed_mps:coords?.speed??null,is_sharing:!!coords,last_seen_at:coords?new Date().toISOString():null,updated_at:new Date().toISOString()};const{error}=await db.from("delivery_tracking").update(payload).eq("id",id);if(error)throw error;}
function fail(id,msg){$("status-"+id).textContent=msg;const b=$("btn-"+id);b.disabled=false;}
async function toggle(id){const row=rows.find(x=>x.id===id),b=$("btn-"+id);if(!row||b.disabled)return;b.disabled=true;if(watchers.has(id)){navigator.geolocation.clearWatch(watchers.get(id));watchers.delete(id);try{await update(id,null);row.is_sharing=false;b.textContent="Start live location";b.classList.remove("stop");$("status-"+id).textContent="Location sharing is off";}catch(e){fail(id,"Could not stop location sharing. Check your connection.");}b.disabled=false;return;}if(!navigator.geolocation){fail(id,"This browser does not support GPS location.");return;}if(row.orders?.status!=="out_for_delivery"){fail(id,"Location sharing is available when the order is marked Out for delivery.");return;}navigator.geolocation.getCurrentPosition(pos=>{const c=pos.coords;update(id,{latitude:c.latitude,longitude:c.longitude,accuracy:c.accuracy,heading:c.heading,speed:c.speed}).then(()=>{const watch=navigator.geolocation.watchPosition(p=>{const c=p.coords;update(id,{latitude:c.latitude,longitude:c.longitude,accuracy:c.accuracy,heading:c.heading,speed:c.speed}).catch(()=>{$("status-"+id).textContent="GPS update failed. Check connection.";});},err=>{$("status-"+id).textContent="GPS paused: "+err.message;},{enableHighAccuracy:true,maximumAge:5000,timeout:20000});watchers.set(id,watch);row.is_sharing=true;b.textContent="Stop sharing";b.classList.add("stop");$("status-"+id).textContent="Live location is being shared";b.disabled=false;}).catch(()=>fail(id,"Could not send GPS location. Check your assignment and connection."));},err=>fail(id,"Location permission needed: "+err.message),{enableHighAccuracy:true,timeout:20000,maximumAge:0});}
window.addEventListener("pagehide",()=>{for(const id of watchers.values())navigator.geolocation.clearWatch(id);});init();
</script></body></html>
