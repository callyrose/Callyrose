<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5eee8"><title>Shopping Cart | CALLYROSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ink:#29211e;--muted:#786c65;--rose:#b97870;--cream:#f5eee8;--paper:#fffdfa;--line:#e9ddd4}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}.top{height:72px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,70px)}.brand{font:500 24px 'Playfair Display',serif;letter-spacing:2.5px}.brand span{color:var(--rose)}.back{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}main{max-width:1050px;margin:auto;padding:42px 20px 80px}.eyebrow{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--rose);font-weight:700}h1{font:400 clamp(36px,5vw,52px) 'Playfair Display',serif;margin:9px 0}.sub{font-size:12px;color:var(--muted);margin:0 0 28px}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,.7fr);gap:22px;align-items:start}.items{display:grid;gap:12px}.cart-item,.summary{background:var(--paper);border:1px solid var(--line);padding:18px}.cart-item{display:grid;grid-template-columns:1fr auto;gap:12px}.item-name{font:400 21px 'Playfair Display',serif}.muted{font-size:10px;color:var(--muted);margin-top:6px}.line-total{font:500 18px 'Playfair Display',serif;color:var(--rose)}.controls{display:flex;align-items:center;gap:8px;margin-top:14px}.qty{border:1px solid var(--line);background:white;width:31px;height:31px}.qty-value{min-width:20px;text-align:center;font-size:11px}.remove{border:0;background:none;color:var(--rose);font-size:10px;margin-left:8px;text-decoration:underline}.summary h2{font:400 25px 'Playfair Display',serif;margin:0 0 18px}.sumrow{display:flex;justify-content:space-between;font-size:11px;margin:13px 0;color:var(--muted)}.sumrow.total{padding-top:14px;border-top:1px solid var(--line);font-weight:700;color:var(--ink)}.sumrow.total strong{font:500 22px 'Playfair Display',serif;color:var(--rose)}.checkout{width:100%;padding:14px;border:0;background:#c9c1ba;color:#fff;font-size:9px;letter-spacing:1px;text-transform:uppercase;margin-top:14px}.checkout:disabled{cursor:not-allowed}.note{font-size:10px;line-height:1.7;color:var(--muted);margin-top:12px}.empty,.loading,.error{background:var(--paper);border:1px solid var(--line);padding:36px 22px;text-align:center;font-size:11px;color:var(--muted);line-height:1.8}.empty h2{font:400 26px 'Playfair Display',serif;color:var(--ink);margin:0 0 8px}.cta{display:inline-block;margin-top:14px;padding:12px 18px;background:var(--ink);color:#fff;font-size:9px;letter-spacing:1px;text-transform:uppercase}@media(max-width:720px){.top{height:62px}.brand{font-size:21px}.layout{grid-template-columns:1fr}.summary{order:-1}} 
</style></head><body>
<header class="top"><a class="brand" href="dashboard.html">CALLY<span>ROSE</span></a><a class="back" href="dashboard.html">← Continue shopping</a></header>
<main><div class="eyebrow">Your selection</div><h1>Shopping Cart</h1><p class="sub">Review your selected pieces before checkout.</p><div id="state" class="loading">Loading your cart…</div><div class="layout" id="layout" hidden><section class="items" id="items"></section><aside class="summary"><h2>Order Summary</h2><div class="sumrow"><span>Subtotal</span><strong id="subtotal">₦0</strong></div><div class="sumrow"><span>Delivery</span><span>Calculated at checkout</span></div><div class="sumrow total"><span>Total</span><strong id="total">₦0</strong></div><button class="checkout" disabled>Checkout is being connected</button><p class="note">Your delivery or branch-pickup choice and secure payment options will be available during checkout.</p></aside></div></main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.119.0";
const supabase=createClient("https://syyvxrxzejfgqjybrnay.supabase.co","sb_publishable_RcRmuAzksTmt8SJX895v3Q_iP6zGrNM",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const state=document.getElementById("state"),layout=document.getElementById("layout"),itemsEl=document.getElementById("items");let cartId=null,rows=[];
const money=n=>"₦"+Number(n||0).toLocaleString("en-NG");
async function load(){const{data:{session},error:authError}=await supabase.auth.getSession();if(authError||!session){location.replace("login.html");return;}const{data:carts,error}=await supabase.from("carts").select("id").eq("customer_id",session.user.id).limit(1);if(error){state.className="error";state.textContent="We couldn't load your cart. Please refresh and try again.";return;}cartId=carts?.[0]?.id;if(!cartId){empty();return;}const{data:cartItems,error:itemError}=await supabase.from("cart_items").select("id,variant_id,quantity").eq("cart_id",cartId);if(itemError){state.className="error";state.textContent="We couldn't load your cart items. Please try again.";return;}if(!cartItems?.length){empty();return;}const variantIds=[...new Set(cartItems.map(x=>x.variant_id))];const{data:variants,error:variantError}=await supabase.from("product_variants").select("id,product_id,size_label,dimensions,colour,price,is_available").in("id",variantIds);if(variantError){state.className="error";state.textContent="We couldn't load product details for your cart.";return;}const productIds=[...new Set((variants||[]).map(v=>v.product_id))];const{data:products,error:productError}=await supabase.from("products").select("id,name,brand").in("id",productIds);if(productError){state.className="error";state.textContent="We couldn't load product names for your cart.";return;}rows=cartItems.map(ci=>{const v=variants.find(x=>x.id===ci.variant_id);const p=v&&products.find(x=>x.id===v.product_id);return{...ci,variant:v,product:p};}).filter(x=>x.variant&&x.product);if(!rows.length){empty();return;}state.hidden=true;layout.hidden=false;render();}
function empty(){state.className="empty";state.innerHTML='<h2>Your cart is waiting</h2><p>You haven’t added any products yet. Explore the collection and choose something for your home.</p><a class="cta" href="dashboard.html#mattresses">Explore the collection</a>';layout.hidden=true;}
function render(){itemsEl.innerHTML=rows.map(r=>'<article class="cart-item"><div><div class="item-name">'+r.product.name+'</div><div class="muted">'+(r.product.brand||"CALLYROSE")+' · '+(r.variant.size_label||r.variant.dimensions||"Selected option")+(r.variant.colour?" · "+r.variant.colour:"")+'</div><div class="controls"><button class="qty" data-action="minus" data-id="'+r.id+'" aria-label="Decrease quantity">−</button><span class="qty-value">'+r.quantity+'</span><button class="qty" data-action="plus" data-id="'+r.id+'" aria-label="Increase quantity">+</button><button class="remove" data-action="remove" data-id="'+r.id+'">Remove</button></div></div><div class="line-total">'+money(Number(r.variant.price)*r.quantity)+'</div></article>').join("");const total=rows.reduce((s,r)=>s+Number(r.variant.price)*r.quantity,0);document.getElementById("subtotal").textContent=money(total);document.getElementById("total").textContent=money(total);itemsEl.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click",()=>change(b.dataset.id,b.dataset.action)));}
async function change(id,action){const row=rows.find(x=>x.id===id);if(!row)return;const button=itemsEl.querySelector('[data-id="'+id+'"][data-action="'+action+'"]');if(button)button.disabled=true;if(action==="remove"||action==="minus"&&row.quantity<=1){const{error}=await supabase.from("cart_items").delete().eq("id",id);if(error){if(button)button.disabled=false;alert("We couldn't update your cart. Please try again.");return;}rows=rows.filter(x=>x.id!==id);}else{const next=action==="plus"?row.quantity+1:row.quantity-1;const{error}=await supabase.from("cart_items").update({quantity:next}).eq("id",id);if(error){if(button)button.disabled=false;alert("We couldn't update your quantity. Please try again.");return;}row.quantity=next;}if(!rows.length)empty();else render();}
load();
</script></body></html>
