<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5eee8"><title>Saved Items | CALLYROSE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--ink:#29211e;--muted:#786c65;--rose:#b97870;--cream:#f5eee8;--paper:#fffdfa;--line:#e9ddd4;--gold:#c8a47c;--shadow:0 18px 48px #39261c12}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}.top{height:72px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,70px)}.brand{font:500 24px 'Playfair Display',serif;letter-spacing:2.5px}.brand span{color:var(--rose)}.top-links{display:flex;gap:18px;align-items:center}.back{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}main{max-width:1050px;margin:auto;padding:42px 20px 80px}.eyebrow{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--rose);font-weight:700}h1{font:400 clamp(36px,5vw,52px) 'Playfair Display',serif;margin:9px 0}.sub{font-size:12px;color:var(--muted);margin:0 0 28px;line-height:1.8}.panel{background:var(--paper);border:1px solid var(--line);padding:clamp(20px,4vw,34px);box-shadow:var(--shadow);animation:rise .55s ease both}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:8px;margin-bottom:17px}.field label{font-size:10px;color:var(--muted);letter-spacing:.4px}.field input{width:100%;padding:14px;border:1px solid var(--line);background:#fffdfa;color:var(--ink);font:12px 'DM Sans',sans-serif;outline:none}.field input:focus{border-color:var(--rose);box-shadow:0 0 0 3px #b9787018}.field input[readonly]{background:#f7f1ed;color:#8c817a}.btn{display:inline-flex;justify-content:center;align-items:center;padding:13px 18px;border:0;background:var(--ink);color:white;font-size:9px;letter-spacing:1px;text-transform:uppercase;cursor:pointer}.btn:hover{background:var(--rose)}.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.message{font-size:11px;color:var(--rose);min-height:20px;margin-top:14px}.notice{padding:22px;background:#f8f1eb;border:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.8}.list{display:grid;gap:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;border:1px solid var(--line);background:#fffdfa}.row strong{font-size:12px}.row small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.amount{font:20px 'Playfair Display',serif;color:var(--rose)}.status{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:#805c4e;background:#f2e9e1;padding:7px 9px}.empty{text-align:center;padding:42px 20px;background:var(--paper);border:1px dashed #d8c4b8}.empty h2{font:400 26px 'Playfair Display',serif;margin:0 0 9px}.empty p{font-size:11px;color:var(--muted);line-height:1.8}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){.top{height:62px}.brand{font-size:21px}.grid{grid-template-columns:1fr}main{padding-top:30px}.row{align-items:flex-start}.amount{font-size:17px}}
</style></head><body><header class="top"><a class="brand" href="dashboard.html">CALLY<span>ROSE</span></a><nav class="top-links"><a class="back" href="dashboard.html">← Back to shop</a><a class="back" href="orders.html">Orders</a></nav></header><main><div class="eyebrow">Your CALLYROSE account</div><h1>Saved Items</h1><p class="sub">Keep the pieces you love close at hand.</p><div id="content" class="panel"><div class="notice">Loading your account…</div></div><p id="message" class="message" role="status"></p></main><style>.saved-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}.saved-card{border:1px solid var(--line);background:#fffdfa;overflow:hidden}.saved-image{height:220px;background:#f1e8df;display:grid;place-items:center}.saved-image img{width:100%;height:100%;object-fit:contain}.saved-image span{font-size:10px;color:var(--muted)}.saved-info{padding:17px}.saved-brand{font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--rose)}.saved-info h2{font:400 22px 'Playfair Display',serif;margin:7px 0}.saved-info p{font-size:10px;color:var(--muted)}.saved-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.saved-actions .btn{font-size:8px;padding:11px 13px}.btn:disabled{opacity:.5}.notice p{font-size:10px;color:var(--muted);line-height:1.7}.actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin-top:18px}</style><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.119.0";
const db=createClient("https://syyvxrxzejfgqjybrnay.supabase.co","sb_publishable_RcRmuAzksTmt8SJX895v3Q_iP6zGrNM",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const $=id=>document.getElementById(id),content=$("content"),message=$("message");
const catalogue={
"cf-student":{name:"Student Mattress",brand:"Current Foam",type:"Student mattress",image:"Assets/IMG_20261124_152809_015.jpg"},
"cf-comfort":{name:"Comfort",brand:"Current Foam",type:"Regular size mattress",image:"Assets/IMG_80f22192-ca3b-4ac3-8ce2-da177fe2d365.jpg"},
"cf-glory":{name:"Glory",brand:"Current Foam",type:"Regular size mattress",image:"Assets/IMG_83bc814e-97cf-4739-b37f-300a51ed6163.jpg"},
"cf-gold":{name:"Gold / Golden",brand:"Current Foam",type:"Regular size mattress",image:"Assets/607a9c242539cc28391324f145830aab.jpg"},
"cf-lexus":{name:"Lexus",brand:"Current Foam",type:"Regular size mattress",image:"Assets/dc9e7fb88b9bb6cd71d4d4bb3a9b3d86.jpg"},
"cf-durapedic":{name:"Durapedic",brand:"Current Foam",type:"Regular size mattress",image:"Assets/9fbd9374ccd4bc9b92e1b0f3cbe45105.jpg"},
"cf-pleasures":{name:"Pleasures",brand:"Current Foam",type:"Regular size mattress",image:"Assets/da66d6ea29a5c958bbcf587de1e26c33.jpg"},
"cf-family-glory":{name:"Glory",brand:"Current Foam",type:"Family size mattress",image:"Assets/IMG_6dc43397-c403-4068-8713-2d00e0f212f1.jpg"},
"cf-family-gold":{name:"Gold / Golden",brand:"Current Foam",type:"Family size mattress",image:"Assets/IMG_80f22192-ca3b-4ac3-8ce2-da177fe2d365.jpg"},
"cf-family-lexus":{name:"Lexus",brand:"Current Foam",type:"Family size mattress",image:"Assets/IMG_83bc814e-97cf-4739-b37f-300a51ed6163.jpg"},
"cf-family-durapedic":{name:"Durapedic",brand:"Current Foam",type:"Family size mattress",image:"Assets/607a9c242539cc28391324f145830aab.jpg"},
"mouka-student":{name:"Student Mattress",brand:"MOUKA Homes",type:"Student mattress",image:"Assets/IMG_80f22192-ca3b-4ac3-8ce2-da177fe2d365.jpg"},
"mouka-cocoa":{name:"Cocoa",brand:"MOUKA Homes",type:"MOUKA mattress",image:"Assets/IMG_83bc814e-97cf-4739-b37f-300a51ed6163.jpg"},
"mouka-flora":{name:"Flora",brand:"MOUKA Homes",type:"MOUKA mattress",image:"Assets/9fbd9374ccd4bc9b92e1b0f3cbe45105.jpg"},
"mouka-orthopedic":{name:"Orthopedic",brand:"MOUKA Homes",type:"MOUKA mattress",image:"Assets/dc9e7fb88b9bb6cd71d4d4bb3a9b3d86.jpg"},
"good-student":{name:"Student Mattress",brand:"Good Mattress Homes",type:"Student mattress",image:"Assets/IMG_6dc43397-c403-4068-8713-2d00e0f212f1.jpg"},
"good-super-mild":{name:"Super Mild",brand:"Good Mattress Homes",type:"Good Mattress collection",image:"Assets/IMG_80f22192-ca3b-4ac3-8ce2-da177fe2d365.jpg"},
"good-mild":{name:"Mild",brand:"Good Mattress Homes",type:"Good Mattress collection",image:"Assets/IMG_83bc814e-97cf-4739-b37f-300a51ed6163.jpg"}
};
const esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let user=null,items=[];
async function load(){content.innerHTML='<div class="notice">Loading your saved items…</div>';const{data:{session},error}=await db.auth.getSession();if(error)throw error;if(!session){location.replace("login.html");return;}user=session.user;const{data,error:loadError}=await db.from("saved_items").select("id,product_key,created_at").eq("customer_id",user.id).order("created_at",{ascending:false});if(loadError)throw loadError;items=data||[];render();}
function render(){if(!items.length){content.innerHTML='<div class="empty"><h2>You haven’t saved anything yet</h2><p>When you save a mattress from its details page, it will be kept here for you.</p><div class="actions"><a class="btn" href="dashboard.html#mattresses">Browse mattresses</a><a class="btn secondary" href="cart.html">Open my cart</a><a class="btn secondary" href="orders.html">View my orders</a></div></div>';return;}
content.innerHTML='<div class="saved-grid">'+items.map(item=>{const p=catalogue[item.product_key]||{name:"Saved product",brand:"CALLYROSE",type:"Product details",image:""};return '<article class="saved-card"><div class="saved-image">'+(p.image?'<img src="'+esc(p.image)+'" alt="'+esc(p.name)+'">':'<span>Product image coming soon</span>')+'</div><div class="saved-info"><div class="saved-brand">'+esc(p.brand)+'</div><h2>'+esc(p.name)+'</h2><p>'+esc(p.type)+'</p><div class="saved-actions"><a class="btn" href="product.html?id='+encodeURIComponent(item.product_key)+'">View details</a><button class="btn secondary" type="button" data-remove="'+esc(item.id)+'">Remove</button></div></div></article>';}).join("")+'</div>';
content.querySelectorAll("[data-remove]").forEach(b=>b.addEventListener("click",()=>removeItem(b.dataset.remove,b)));}
async function removeItem(id,button){button.disabled=true;const{error}=await db.from("saved_items").delete().eq("id",id).eq("customer_id",user.id);if(error){button.disabled=false;message.textContent="We couldn’t remove this saved item. Please try again.";return;}items=items.filter(x=>x.id!==id);message.textContent="Item removed from your saved collection.";render();}
async function run(){try{await load()}catch(e){content.innerHTML='<div class="notice"><strong>Your saved items could not be loaded.</strong><p>Check your connection and try again. Your saved collection has not been changed.</p><button class="btn" id="retrySaved" type="button">Try again</button></div>';const b=$("retrySaved");if(b)b.onclick=run;message.textContent=e.message||"";}}
run();
</script></body></html>
