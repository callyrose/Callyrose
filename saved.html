<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5eee8"><title>Saved Items | CALLYROSE</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--ink:#29211e;--muted:#786c65;--rose:#b97870;--cream:#f5eee8;--paper:#fffdfa;--line:#e9ddd4;--gold:#c8a47c;--shadow:0 18px 48px #39261c12}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}.top{height:72px;background:var(--paper);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,5vw,70px)}.brand{font:500 24px 'Playfair Display',serif;letter-spacing:2.5px}.brand span{color:var(--rose)}.top-links{display:flex;gap:18px;align-items:center}.back{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--muted)}main{max-width:1050px;margin:auto;padding:42px 20px 80px}.eyebrow{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--rose);font-weight:700}h1{font:400 clamp(36px,5vw,52px) 'Playfair Display',serif;margin:9px 0}.sub{font-size:12px;color:var(--muted);margin:0 0 28px;line-height:1.8}.panel{background:var(--paper);border:1px solid var(--line);padding:clamp(20px,4vw,34px);box-shadow:var(--shadow);animation:rise .55s ease both}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{display:grid;gap:8px;margin-bottom:17px}.field label{font-size:10px;color:var(--muted);letter-spacing:.4px}.field input{width:100%;padding:14px;border:1px solid var(--line);background:#fffdfa;color:var(--ink);font:12px 'DM Sans',sans-serif;outline:none}.field input:focus{border-color:var(--rose);box-shadow:0 0 0 3px #b9787018}.field input[readonly]{background:#f7f1ed;color:#8c817a}.btn{display:inline-flex;justify-content:center;align-items:center;padding:13px 18px;border:0;background:var(--ink);color:white;font-size:9px;letter-spacing:1px;text-transform:uppercase;cursor:pointer}.btn:hover{background:var(--rose)}.btn.secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}.message{font-size:11px;color:var(--rose);min-height:20px;margin-top:14px}.notice{padding:22px;background:#f8f1eb;border:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.8}.list{display:grid;gap:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;border:1px solid var(--line);background:#fffdfa}.row strong{font-size:12px}.row small{display:block;color:var(--muted);font-size:10px;margin-top:5px}.amount{font:20px 'Playfair Display',serif;color:var(--rose)}.status{font-size:9px;text-transform:uppercase;letter-spacing:.7px;color:#805c4e;background:#f2e9e1;padding:7px 9px}.empty{text-align:center;padding:42px 20px;background:var(--paper);border:1px dashed #d8c4b8}.empty h2{font:400 26px 'Playfair Display',serif;margin:0 0 9px}.empty p{font-size:11px;color:var(--muted);line-height:1.8}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@media(max-width:600px){.top{height:62px}.brand{font-size:21px}.grid{grid-template-columns:1fr}main{padding-top:30px}.row{align-items:flex-start}.amount{font-size:17px}}
</style></head><body><header class="top"><a class="brand" href="dashboard.html">CALLY<span>ROSE</span></a><nav class="top-links"><a class="back" href="dashboard.html">← Back to shop</a><a class="back" href="orders.html">Orders</a></nav></header><main><div class="eyebrow">Your CALLYROSE account</div><h1>Saved Items</h1><p class="sub">Keep the pieces you love close at hand.</p><div id="content" class="panel"><div class="notice">Loading your account…</div></div><p id="message" class="message" role="status"></p></main><script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2.119.0";const supabase=createClient("https://syyvxrxzejfgqjybrnay.supabase.co","sb_publishable_RcRmuAzksTmt8SJX895v3Q_iP6zGrNM",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id),content=$("content"),msg=$("message");const money=n=>"₦"+Number(n||0).toLocaleString("en-NG");const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));const {data:{session},error:authError}=await supabase.auth.getSession();if(authError||!session){location.replace("login.html");throw new Error("Authentication required");}const user=session.user;const page="saved";
async function load(){if(page==="profile"){const{data:p,error}=await supabase.from("profiles").select("full_name,phone").eq("id",user.id).maybeSingle();if(error)throw error;const name=p?.full_name||user.user_metadata?.full_name||"";content.innerHTML='<div class="grid"><div class="field"><label for="fullName">Full name</label><input id="fullName" value="'+esc(name)+'" autocomplete="name"></div><div class="field"><label for="phone">Phone number</label><input id="phone" value="'+esc(p?.phone||"")+'" autocomplete="tel"></div><div class="field"><label>Email address</label><input value="'+esc(user.email||"")+'" readonly></div></div><button class="btn" id="save">Save profile</button>'; $("save").onclick=async()=>{const full_name=$("fullName").value.trim(),phone=$("phone").value.trim();if(!full_name){msg.textContent="Please enter your full name.";return;}const{error:e}=await supabase.from("profiles").update({full_name,phone}).eq("id",user.id);if(e){msg.textContent="We couldn't save your profile. "+e.message;return;}await supabase.auth.updateUser({data:{full_name}});msg.textContent="Your profile has been updated.";};}
else if(page==="transactions"){const{data:orders,error:e}=await supabase.from("orders").select("id,order_number,created_at,total").eq("customer_id",user.id).order("created_at",{ascending:false});if(e)throw e;if(!orders?.length){content.innerHTML='<div class="empty"><h2>No transactions yet</h2><p>Payment records will appear here when you place an order.</p><a class="btn" href="dashboard.html">Explore the collection</a></div>';return;}const ids=orders.map(o=>o.id);const{data:payments,error:pe}=await supabase.from("payments").select("id,order_id,provider,provider_reference,amount,currency,status,verified_at,created_at").in("order_id",ids).order("created_at",{ascending:false});if(pe)throw pe;const rows=payments||[];content.innerHTML=rows.length?'<div class="list">'+rows.map(p=>{const o=orders.find(x=>x.id===p.order_id);return '<div class="row"><div><strong>'+(esc(o?.order_number||"Order"))+'</strong><small>'+new Date(p.created_at).toLocaleString("en-NG")+' · '+esc(p.provider||"Payment")+(p.provider_reference?" · "+esc(p.provider_reference):"")+'</small></div><div style="text-align:right"><div class="amount">'+money(p.amount)+'</div><span class="status">'+esc(p.status)+'</span></div></div>';}).join("")+'</div>':'<div class="empty"><h2>No payment records yet</h2><p>Your orders exist, but payment records will show here once payment is initiated.</p><a class="btn" href="orders.html">View my orders</a></div>';}
else if(page==="saved"){content.innerHTML='<div class="empty"><h2>Your saved collection</h2><p>This page is ready, but saved items are not connected to a wishlist table yet. I won’t pretend your favourites are being stored when they are not.</p><a class="btn" href="dashboard.html">Browse products</a></div>';}
else if(page==="settings"){content.innerHTML='<div class="list"><div class="row"><div><strong>Account email</strong><small>'+esc(user.email||"")+'</small></div><span class="status">Verified by sign-in</span></div><div class="row"><div><strong>Password and security</strong><small>Request a secure password reset link to your email.</small></div><button class="btn secondary" id="reset">Send reset link</button></div><div class="row"><div><strong>Sign out</strong><small>Sign out of this device.</small></div><button class="btn secondary" id="logout">Sign out</button></div></div>'; $("reset").onclick=async()=>{const{error}=await supabase.auth.resetPasswordForEmail(user.email,{redirectTo:location.origin+location.pathname.replace(/[^/]*$/,"")+"login.html"});msg.textContent=error?"Could not send reset email. "+error.message:"Password reset link sent. Check your inbox.";};$("logout").onclick=async()=>{const{error}=await supabase.auth.signOut();if(error){msg.textContent="Could not sign out. Try again.";return;}location.replace("login.html");};}}
try{await load()}catch(e){content.innerHTML='<div class="notice">We could not load this page right now. Please refresh and try again.</div>';msg.textContent=e.message||"Please try again.";}
</script></body></html>
